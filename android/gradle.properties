# -Duser.language/-Duser.country: Die Systemsprache dieser Maschine ist
# Persisch (fa_AT). Die JVM übernimmt daraus persische Ziffern (۰۱۲۳…), und
# `bundletool` baut damit beim Release-Bundle den Dateinamen `classes۲.dex`
# zusammen, findet aber `classes2.dex` — der Build bricht mit „Invalid dex
# file indices" ab (nur Release/AAB, der Debug-Build läuft durch).
# Erzwungenes englisches Locale hält die Zahlformatierung ASCII.
# Siehe PLAN.md Phase 15.1.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Duser.language=en -Duser.country=US
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
