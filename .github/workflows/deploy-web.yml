# Baut die Web-Fassung von Root-in und veröffentlicht sie auf GitHub Pages
# (PLAN.md Phase 26.3).
#
# Trennung von Quelle und Ergebnis, wie im Auftrag verlangt:
# Im Zweig `main` liegt **nur** Quellcode. Das gebaute Ergebnis wird nie
# eingecheckt — es geht als Pages-Artefakt direkt an die Veröffentlichung.
# Damit kann `build/web` gar nicht erst in der Versionsgeschichte landen.
name: Web bauen und veröffentlichen

on:
  push:
    branches: [main]
  # Erlaubt einen Lauf von Hand, ohne dass etwas gepusht werden muss.
  workflow_dispatch:

# Rechte des automatischen Tokens: nur so viel wie nötig.
permissions:
  contents: read
  pages: write
  id-token: write

# Ein Push während eines laufenden Baus bricht den alten ab, statt zwei
# Veröffentlichungen um dieselbe Seite streiten zu lassen.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Abhängigkeiten holen
        run: flutter pub get

      # Erst prüfen, dann veröffentlichen: Eine Fassung mit roten Tests soll
      # nicht online gehen.
      - name: Analyse
        run: flutter analyze

      # ⚠️ HIER KEIN `--no-test-assets`. Das Flag spart lokal Zeit, weil die
      # Test-Assets schon gebaut sind. Ein CI-Lauf beginnt aber immer mit
      # einem frischen Checkout — das entspricht `flutter clean`, und dann
      # fehlen die Assets komplett: 11 Widget-Tests scheitern an
      # `Asset 'shaders/ink_sparkle.frag' not found`. Das sind KEINE echten
      # Fehler, aber sie halten die Veröffentlichung auf.
      # Genau daran ist Lauf 1 gescheitert (PLAN.md Abschnitt 11, Lehre 29).
      - name: Tests
        run: flutter test

      # `--base-href` MUSS auf GitHub Pages der Repository-Name sein, sonst
      # sucht die Seite ihre Dateien im Wurzelverzeichnis der Domain.
      # `github.event.repository.name` liefert ihn, ohne ihn hier fest
      # einzutragen — ein umbenanntes Repository bricht den Bau damit nicht.
      - name: Web bauen
        run: ./tool/build_web.sh "/${{ github.event.repository.name }}/"
        # Supabase (PLAN.md Phase 27.3). Die Werte kommen aus
        # Settings → Secrets and variables → Actions.
        #
        # ⚠️ SIND DIE SECRETS NICHT GESETZT, sind die Werte leer — dann baut
        # die Automatik eine Fassung OHNE Konto und ohne Cloud. Das ist kein
        # Fehler und bricht nichts: Die App verhält sich dann genau wie vor
        # Phase 27 (siehe `supportsCloudSync`).
        #
        # ⚠️ Hier gehört ausschließlich der anon/publishable key hinein. Er
        # landet im ausgelieferten Bundle und ist dort lesbar — das ist so
        # vorgesehen. Der `service_role`-Schlüssel niemals: Er umgeht jede
        # Zugriffsregel, und dieses Repository ist öffentlich.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # Browser-Durchgang gegen den GERADE GEBAUTEN Stand, vor der
      # Veröffentlichung (PLAN.md 29.3).
      #
      # ⚠️ Warum das hier stehen MUSS: Keiner der Tests oben öffnet einen
      # Browser — sie laufen alle auf der Dart-VM. Genau diese Lücke hat in
      # Phase 26 drei kaputte Hauptseiten durchgelassen (Lehre 31), und mit
      # dem Wegfall des Entwicklungsrechners war sie wieder offen (Lehre 39).
      #
      # ⚠️ **Dieser Schritt BLOCKIERT die Veröffentlichung — mit Absicht.**
      # Beim ersten Einbau lief er mit `continue-on-error: true`, weil er
      # vorher nirgends erprobt werden konnte. Genau daran fiel auf, dass
      # diese Zeile die Prüfung wertlos macht: Ein Schritt mit
      # `continue-on-error` meldet auch dann „success", wenn er
      # fehlgeschlagen ist — von außen ist beides nicht zu unterscheiden,
      # und ohne Zugriff auf das Protokoll war die Zusage „grün gelaufen"
      # nicht überprüfbar. Ein Tor, das immer offen steht, ist eine Tür im
      # Feld.
      # ➜ Bleibt so. Wer ihn wieder auf „nicht blockierend" stellt, schaltet
      #   die einzige Browser-Prüfung des Projekts ab, ohne dass es auffällt.
      #
      # Ausliefern und Prüfen stehen in `tool/webtest_serve.sh` — dieselbe
      # Stelle nutzt die Gegenprobe (`webtest-gegenprobe.yml`), die beweist,
      # dass dieser Durchgang überhaupt rot werden kann (PLAN.md 31.2).
      - name: Browser-Durchgang
        run: bash tool/webtest_serve.sh "${{ github.event.repository.name }}"
        env:
          # ⚠️ Ist ein Supabase-Schlüssel hinterlegt, MUSS die Rubrik
          # „Konto & Cloud" erscheinen. Ohne diesen Schalter hielte der
          # Durchgang eine fehlende Rubrik für „ohne Schlüssel gebaut" — und
          # eine Änderung, die sie versehentlich versteckt, ginge grün durch.
          WEBTEST_EXPECT_CLOUD: ${{ secrets.SUPABASE_URL != '' && '1' || '' }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
