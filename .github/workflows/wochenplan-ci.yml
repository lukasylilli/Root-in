# NUR für den Nebenzweig `wochenplan` (PLAN.md Phase 32) — wird VOR dem
# Zusammenführen in `main` wieder gelöscht und gehört nie dorthin.
#
# Grund: Es gibt keinen Entwicklungsrechner (PLAN.md Abschnitt 9). Der von
# Drift generierte Code (`*.g.dart`) liegt im Repository und muss nach einer
# Spaltenänderung neu erzeugt werden — das geht nur mit `build_runner`. Dieser
# Ablauf erzeugt ihn, schreibt ihn auf den Zweig zurück, führt `analyze` und
# `test` aus und legt die Berichte unter `ci-report/` ab, damit sie lesbar sind
# (Protokolle brauchen eine Anmeldung). Er VERÖFFENTLICHT NICHTS.
name: Wochenplan prüfen (Nebenzweig)

on:
  push:
    branches: [wochenplan]
    paths-ignore:
      - 'ci-report/**'

permissions:
  contents: write

concurrency:
  group: wochenplan-ci
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Abhängigkeiten holen
        shell: bash
        run: |
          mkdir -p ci-report
          flutter --version | tee ci-report/flutter-version.txt
          flutter pub get

      - name: Drift-Code erzeugen
        shell: bash
        run: dart run build_runner build --delete-conflicting-outputs 2>&1 | tee ci-report/build_runner.txt

      - name: Analyse
        shell: bash
        continue-on-error: true
        run: flutter analyze 2>&1 | tee ci-report/analyze.txt

      - name: Tests
        shell: bash
        continue-on-error: true
        run: flutter test --reporter expanded 2>&1 | tee ci-report/test.txt

      - name: Ergebnis auf den Zweig zurückschreiben
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lib ci-report
          if git diff --cached --quiet; then
            echo "Nichts zurückzuschreiben."
          else
            git commit -m "ci: generierter Drift-Code und Berichte (Nebenzweig wochenplan)"
            git push
          fi
